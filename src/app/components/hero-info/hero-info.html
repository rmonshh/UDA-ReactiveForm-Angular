<div class="info">
  <span class="etiqueta">{{ etiqueta }}</span>   <!-- {{ }} imprime el valor del @Input -->

  <h1>{{ titulo }}</h1>

  <p class="subtitulo">{{ subtitulo }}</p>

  <ul>
    @for (p of puntos; track p) {                <!-- repite el <li> por cada texto del array -->
      <li>{{ p }}</li>
    }
  </ul>
</div>
