<article class="tarjeta" [class]="variante">
  <div class="icono">
  @switch (icono) {
    @case ('sonrisa') {
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="24" cy="24" r="20"/>
        <circle cx="17" cy="19" r="1.5" fill="currentColor"/>
        <circle cx="31" cy="19" r="1.5" fill="currentColor"/>
        <path d="M15 29c3 5 15 5 18 0"/>
      </svg>
    }
    @case ('trofeo') {
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 8h20v10a10 10 0 0 1-20 0z"/>
        <path d="M14 12H8v3a6 6 0 0 0 6 6"/>
        <path d="M34 12h6v3a6 6 0 0 1-6 6"/>
        <path d="M24 28v8"/>
        <path d="M16 42h16"/>
      </svg>
    }
    @case ('ventana') {
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="36" height="32"/>
        <path d="M6 18h36"/>
        <path d="M12 13h3"/>
      </svg>
    }
    @case ('personas') {
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="24" cy="15" r="6"/>
        <path d="M12 38c0-7 5-12 12-12s12 5 12 12"/>
        <circle cx="8" cy="21" r="3.5"/>
        <circle cx="40" cy="21" r="3.5"/>
      </svg>
    }
  }
</div>
  <h3>{{ titulo }}</h3>
  <p>{{ texto }}</p>
</article>
